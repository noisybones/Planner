<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Домашний планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#F3F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one working column of ledgers; on wide screens the overview splits into "where the money goes" and "what's due". */
:root{
  --bg:#F3F2F7; --surface:#FFFFFF; --sunk:#EAE8F1; --ink:#1E1B2B; --muted:#686479; --line:#DEDBE8;
  --accent:#4A3A8C; --accent-ink:#FFFFFF; --accent-soft:#E9E5F6;
  --good:#257150; --good-soft:#E1F1E8; --warn:#9A5F0C; --warn-soft:#F7ECD9; --bad:#AE3434; --bad-soft:#F8E3E3;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121B; --surface:#1D1A27; --sunk:#25222F; --ink:#ECEAF4; --muted:#A29EB3; --line:#332F40;
  --accent:#B3A0F2; --accent-ink:#1A1530; --accent-soft:#2D2747;
  --good:#6CC79A; --good-soft:#1D3328; --warn:#E3AE5C; --warn-soft:#3A2E1A; --bad:#F08A8A; --bad-soft:#3D2023;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121B; --surface:#1D1A27; --sunk:#25222F; --ink:#ECEAF4; --muted:#A29EB3; --line:#332F40;
  --accent:#B3A0F2; --accent-ink:#1A1530; --accent-soft:#2D2747;
  --good:#6CC79A; --good-soft:#1D3328; --warn:#E3AE5C; --warn-soft:#3A2E1A; --bad:#F08A8A; --bad-soft:#3D2023;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.modules{display:flex;gap:4px;flex-wrap:wrap}
.mod{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.mod.on{background:var(--ink);color:var(--bg)}
.mod[disabled]{cursor:default;opacity:.55}
.mod[disabled]::after{content:" · скоро";font-weight:500}

/* budget nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.month{display:flex;align-items:center;gap:4px}
.month b{min-width:128px;text-align:center;font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:16px}

main{padding-block:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 .side{font-size:13px;font-weight:600;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum>div{background:var(--surface);padding:14px 16px;min-width:0}
.sum .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sum .v{font-family:var(--f-display);font-weight:500;font-size:22px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .s{font-size:12px;color:var(--muted);margin-top:2px}
.sum .free .v{color:var(--good)} .sum .free.neg .v{color:var(--bad)}

.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:var(--r);padding:12px 16px}
.callout p{margin:0;font-weight:600}

/* category ledger */
.grp{padding-block:6px}
.grp+.grp{border-top:1px solid var(--line)}
.grp-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding-block:6px}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .a{text-align:right;white-space:nowrap}
.row .a em{font-style:normal;color:var(--muted)}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.row.over .meter i{background:var(--bad)} .row.over .a{color:var(--bad)}
.row.full .meter i{background:var(--good)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.mute{background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* payment list */
.pay{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.day{font-size:12px;font-weight:800;color:var(--muted);text-align:center;background:var(--sunk);border-radius:6px;padding:4px 0}
.pay .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .sub{font-size:12px;color:var(--muted)}
.pay.done .n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.pay.late .day{background:var(--bad-soft);color:var(--bad)}
.check{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.check.on{background:var(--good-soft);border-color:transparent;color:var(--good)}

/* buttons & forms */
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
input[type=text],input[type=number],input[type=date],input[type=month],input[inputmode],select{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input.money{text-align:right;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
label.f>*{font-size:15px;font-weight:500;color:var(--ink)}
.cb{display:flex;align-items:center;gap:8px;font-weight:600}
.cb input{width:18px;height:18px;accent-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.addrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;margin-top:10px}
@media (max-width:640px){.addrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.addrow .btn{grid-column:1/-1}}

/* plan */
.eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-weight:600}
.eq .op{color:var(--muted);font-weight:500}
.eq .res{font-family:var(--f-display);font-weight:500;font-size:20px}
.eq .res.pos{color:var(--good)} .eq .res.neg{color:var(--bad)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px;gap:10px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12px;color:var(--muted)}
.prow.off .n{color:var(--muted);text-decoration:line-through}
.prow.item{grid-template-columns:auto minmax(0,1fr) auto auto}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding-block:5px}
.erow .sub{font-size:12px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}

/* lists */
.tx{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);border-radius:6px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.tx:hover{background:var(--sunk)}
.tx .d{font-size:13px;font-weight:700;color:var(--muted)}
.tx .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;white-space:nowrap}
.tx .a.inc{color:var(--good)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select{width:auto;max-width:100%}
.rec{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:6px}
.rec:hover{background:var(--sunk)}
.rec.inactive{opacity:.55}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:4px}
.catrow.arch input{color:var(--muted);text-decoration:line-through}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:16px;padding:22px}}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin-bottom:14px}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:7px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.actions .r{display:flex;gap:8px;margin-left:auto}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(40,25,90,.28)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.state{padding:40px 0;text-align:center;color:var(--muted)}
.empty{padding:14px 0;color:var(--muted);font-size:14px}
/* economy */
.eco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center}
@media (max-width:640px){.eco{grid-template-columns:minmax(0,1fr)}}
.eco .big{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.1;color:var(--accent)}
.eco .big.neg{color:var(--bad)}
.eco .big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted)}
.brk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.brk .t{color:var(--muted)} .brk .v{text-align:right;font-weight:600;white-space:nowrap}
.brk .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:800}
.preview{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
/* shop */
.stores{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.store{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;white-space:nowrap;display:flex;gap:6px;align-items:center}
.store.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.store .cnt{font-size:12px;opacity:.7}
.sadd{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;margin-block:12px 4px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.item .q{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.item.done .n{color:var(--muted);background-size:100% 1.5px}
.item.done .tbox{background:var(--good);border-color:var(--good);color:#fff}
/* recipes */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard:hover{border-color:var(--accent)}
.rcard .t{font-weight:800;font-size:16px}
.rcard .m{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.ing{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:6px;border-top:1px solid var(--line)}
.ing input{width:18px;height:18px;accent-color:var(--accent)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:120px;font:inherit;color:inherit;resize:vertical}
.rtitle{font-family:var(--f-display);font-weight:500;font-size:24px}
@media (max-width:820px){.grid2>.ingp{order:-1}}
/* study */
.semb{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:8px}
.semb i{display:block;height:100%;background:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccode{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.ccard .t{font-weight:800;font-size:16px}
.ccard .m{font-size:13px;color:var(--muted)}
.tchip{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;margin-right:4px;vertical-align:1px}
.tchip.hw{background:var(--accent-soft);color:var(--accent)} .tchip.test{background:var(--warn-soft);color:var(--warn)}
.tchip.exam{background:var(--bad-soft);color:var(--bad)} .tchip.prep{background:var(--good-soft);color:var(--good)} .tchip.other{background:var(--sunk);color:var(--muted)}
.syb{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.syb.dim .syhead{opacity:.6}
.syhead,.sysec{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;text-align:left;color:inherit;font:inherit}
.syhead .syt{font-weight:800;font-size:15px}
.sysec{width:100%;padding:7px 0 7px 18px;flex-wrap:wrap}
.sysec .syt{font-weight:700;font-size:14px;flex:1;min-width:0}
.car{width:12px;color:var(--muted);flex:none}
.syt{flex:1;min-width:0;overflow-wrap:anywhere}
.sycnt{font-size:12px;color:var(--muted);font-weight:700}
.symeter{flex-basis:100%;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-left:20px}
.symeter i{display:block;height:100%;background:var(--good)}
.sylist{padding-left:30px;margin-bottom:4px}
.sytop{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:6px;padding-block:3px;font-size:14px}
.sydot{width:28px;height:28px;border:0;background:none;font-size:17px;line-height:1;padding:0;color:var(--muted)}
.sytop.s1 .sydot{color:var(--accent)} .sytop.s2 .sydot{color:var(--good)} .sytop.s2 span{color:var(--muted)} .sytop.s3 .sydot{color:var(--bad)} .sytop.s3 span{font-weight:700}
.synote{padding:2px 0 4px 20px;white-space:pre-line}
.sylegend{margin-top:6px;font-size:12px}
/* home */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hcard .t{font-weight:800;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hcard .hsum{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--accent);overflow-wrap:anywhere}
.dims{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px}
.dims .k{color:var(--muted)} .dims .v{font-weight:700;text-align:right;white-space:nowrap}
.hcard .acts{display:flex;gap:12px;margin-top:2px}
.room-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 -4px}
.drow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px;align-items:center}
/* tasks */
.tday{font-family:var(--f-display);font-weight:500;font-size:22px;margin-bottom:2px}
.qadd{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin-block:12px 6px}
.qadd input[type=date]{width:150px}.qadd input[type=time]{width:110px}
@media (max-width:640px){.qadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qadd input:first-child{grid-column:1/-1}.qadd input[type=date],.qadd input[type=time]{width:100%}.qadd .btn{grid-column:1/-1}}
input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-block:14px 4px}
.tsec.late{color:var(--bad)}
.task{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.tbox{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:900;padding:0}
.tbox:hover{border-color:var(--accent)}
.task.done .tbox{background:var(--good);border-color:var(--good);color:#fff}
.ttl{border:0;background:none;text-align:left;padding:0;min-width:0}
.ttl .n{display:inline;font-weight:600;overflow-wrap:anywhere;background:linear-gradient(var(--muted),var(--muted)) no-repeat 0 55%/0% 1.5px}
.task.done .ttl .n{color:var(--muted);background-size:100% 1.5px}
.ttl .sub{display:block;font-size:12px;color:var(--muted)}
.ttl .sub.late{color:var(--bad);font-weight:700}

<script>
/* ===== Автономный режим: данные хранятся в памяти телефона ===== */
(function(){
const KEY="planner-db-v1";
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
const subs=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){const err=new Error("Память переполнена");err.code="quota";throw err}}
function docSnap(path){const has=Object.prototype.hasOwnProperty.call(store,path);return {id:path.split("/").pop(),exists:has,data:()=>has?clone(store[path]):undefined,metadata:{fromCache:false}}}
function colSnap(col){const docs=Object.keys(store).filter(p=>p.split("/")[0]===col&&p.split("/").length===2).map(p=>({id:p.split("/")[1],exists:true,data:()=>clone(store[p])}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}}
function fire(path){const col=path.split("/")[0];setTimeout(()=>{for(const s of subs.slice()){try{if(s.path===path)s.cb(docSnap(path));else if(s.col===col)s.cb(colSnap(col))}catch(e){console.error(e)}}},0)}
function docRef(path){return {
  set(d){return new Promise((ok,no)=>{const prev=store[path];store[path]=clone(d);try{persist()}catch(e){if(prev===undefined)delete store[path];else store[path]=prev;no(e);return}fire(path);ok()})},
  delete(){return new Promise((ok,no)=>{const prev=store[path];delete store[path];try{persist()}catch(e){store[path]=prev;no(e);return}fire(path);ok()})},
  get(){return Promise.resolve(docSnap(path))},
  onSnapshot(cb){const s={path,cb};subs.push(s);setTimeout(()=>cb(docSnap(path)),0);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
}}
const db={doc:docRef,collection(col){return {doc:id=>docRef(col+"/"+id),get:()=>Promise.resolve(colSnap(col)),
  onSnapshot(cb){const s={col,cb};subs.push(s);setTimeout(()=>cb(colSnap(col)),0);return ()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}}};
window.claude={use:n=>Promise.resolve(n==="db"?db:null)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ===== Резервная копия ===== */
const LB="planner-last-backup";
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function dump(){return JSON.stringify({app:"domashnij-planer",v:1,exported:new Date().toISOString(),docs:store},null,1)}
async function saveFile(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==="AbortError")return false}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true}
function parseBackup(text){let o;try{o=JSON.parse(text)}catch(e){throw new Error("Это не похоже на файл копии планера")}
  const docs=o&&o.docs&&typeof o.docs==="object"?o.docs:null;if(!docs)throw new Error("В файле нет данных планера");
  for(const k of Object.keys(docs)){if(!/^[^/]+\/[^/]+$/.test(k))throw new Error("Повреждённая запись: "+k);
    const d=docs[k];if(!d||typeof d!=="object")throw new Error("Повреждённая запись: "+k);
    /* старые ссылки на Google Календарь из версии в Claude больше не нужны */
    if(k.startsWith("tasks/")){delete d.cal;delete d.calErr}
    if(k.startsWith("study/")&&Array.isArray(d.items))d.items.forEach(i=>{delete i.cal;delete i.calErr})}
  return docs}
function restore(docs){store=clone(docs);persist();location.reload()}
function summary(docs){const c={};for(const k of Object.keys(docs)){const g=k.split("/")[0];c[g]=(c[g]||0)+1}
  const n={months:"месяцев бюджета",tasks:"дел",shop:"магазинов",recipes:"рецептов",home:"замеров",study:"предметов"};
  return Object.entries(n).filter(([k])=>c[k]).map(([k,l])=>l+": "+c[k]).join(", ")||"пусто"}
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

function panelHTML(){const lb=localStorage.getItem(LB);const empty=!Object.keys(store).length;
  return `<div class="dp-scrim" data-dp="close"></div><div class="dp" role="dialog" aria-modal="true" aria-label="Данные и копии">
  <div class="dp-h"><h3>Данные</h3><button class="iconbtn" type="button" data-dp="close" aria-label="Закрыть">✕</button></div>
  ${isIOS&&!isStandalone()?`<div class="dp-note"><b>Поставь планер на экран «Домой».</b> В Safari нажми «Поделиться» (квадрат со стрелкой) → «На экран "Домой"». Открывай планер только с этой иконки: так данные хранятся надёжно.</div>`:""}
  <p class="dp-t">Все данные лежат только в этом телефоне, без облака и аккаунтов. ${empty?"Сейчас здесь пусто.":"Сейчас: "+summary(store)+"."}</p>
  <h4>Резервная копия</h4>
  <p class="dp-t">${lb?"Последняя копия: "+lb+".":"Копию ещё не делали."} Сохраняй файл в «Файлы» → iCloud Drive раз в неделю или две: если телефон потеряется или сбросится, всё вернётся из копии.</p>
  <div class="dp-row"><button class="btn" type="button" data-dp="export">Сохранить копию</button><button class="btn ghost" type="button" data-dp="copy">Скопировать текстом</button></div>
  <h4>Восстановить или перенести</h4>
  <p class="dp-t">Выбери файл копии или вставь текст копии. Данные в телефоне заменятся данными из копии.</p>
  <div class="dp-row"><label class="btn ghost" style="display:inline-flex;align-items:center">Выбрать файл<input type="file" accept=".json,application/json,text/plain" data-dp="file" hidden></label></div>
  <textarea class="dp-ta" id="dp-text" placeholder="…или вставь текст копии сюда" rows="4"></textarea>
  <div class="dp-row"><button class="btn ghost" type="button" data-dp="paste">Загрузить из текста</button></div>
  <div class="dp-msg" id="dp-msg" role="status"></div>
  <p class="dp-t" style="margin-top:18px">Напоминания: у дела с датой есть кнопка «📅 В календарь», она добавляет его в календарь iPhone с напоминанием (а оттуда, если календарь подключён, в Outlook).</p>
  </div>`}
function openPanel(){let L=document.getElementById("dp-layer");if(!L){L=document.createElement("div");L.id="dp-layer";document.body.appendChild(L)}L.innerHTML=panelHTML()}
function closePanel(){const L=document.getElementById("dp-layer");if(L)L.innerHTML=""}
function msg(t,bad){const m=document.getElementById("dp-msg");if(m){m.textContent=t;m.style.color=bad?"var(--bad)":"var(--good)"}}
function askRestore(docs){const cur=Object.keys(store).length;
  if(!cur||confirm("Заменить данные в телефоне копией?\n\nВ копии: "+summary(docs)+".\nСейчас в телефоне: "+summary(store)+"."))restore(docs)}
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-gear]");if(g){openPanel();return}
  const b=e.target.closest("[data-dp]");if(b){const a=b.dataset.dp;
    if(a==="close"){closePanel();return}
    if(a==="export"){const ok=await saveFile("planer-"+stamp()+".json",dump(),"application/json");if(ok){localStorage.setItem(LB,stamp());msg("Копия готова. Сохрани её в «Файлы».")}return}
    if(a==="copy"){try{await navigator.clipboard.writeText(dump());localStorage.setItem(LB,stamp());msg("Скопировано. Вставь в Заметки или отправь себе.")}catch(err){msg("Не получилось скопировать: попробуй «Сохранить копию»",true)}return}
    if(a==="paste"){const t=document.getElementById("dp-text").value.trim();if(!t){msg("Сначала вставь текст копии",true);return}try{askRestore(parseBackup(t))}catch(err){msg(err.message,true)}return}
  }
  const ic=e.target.closest("[data-act=ics]");if(ic){e.stopPropagation();e.preventDefault();icsFromSheet()}
},true);
document.addEventListener("change",e=>{const f=e.target.closest("[data-dp=file]");if(!f||!f.files[0])return;
  f.files[0].text().then(t=>{try{askRestore(parseBackup(t))}catch(err){msg(err.message,true)}})});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel()});
window.plannerOpenData=openPanel;

/* ===== Дело → календарь iPhone (.ics) ===== */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m)}
function ymd(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}
function hms(d){const p=n=>String(n).padStart(2,"0");return p(d.getHours())+p(d.getMinutes())+"00"}
function makeIcs(t){const [y,m,d]=t.date.split("-").map(Number);const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Domashnij planer//RU","CALSCALE:GREGORIAN","BEGIN:VEVENT",
  "UID:"+(t.id||Date.now())+"@planer","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),"SUMMARY:"+icsEsc(t.title)];
  if(t.time){const [hh,mm]=t.time.split(":").map(Number);const st=new Date(y,m-1,d,hh,mm),en=new Date(st.getTime()+30*6e4);
    L.push("DTSTART:"+ymd(st)+"T"+hms(st),"DTEND:"+ymd(en)+"T"+hms(en))}
  else{L.push("DTSTART;VALUE=DATE:"+ymd(new Date(y,m-1,d)),"DTEND;VALUE=DATE:"+ymd(new Date(y,m-1,d+1)))}
  const fr={day:"DAILY",week:"WEEKLY",month:"MONTHLY",year:"YEARLY"}[t.repeat];if(fr)L.push("RRULE:FREQ="+fr);
  if(t.note)L.push("DESCRIPTION:"+icsEsc(t.note));
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"TRIGGER:"+(t.time?"-PT15M":"-PT6H"),"END:VALARM","END:VEVENT","END:VCALENDAR");
  return L.join("\r\n")}
function icsFromSheet(){const v=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
  const t={title:v("k-title"),date:v("k-date"),time:v("k-time"),note:v("k-note"),repeat:v("k-rep")};
  const cid=document.querySelector("[data-act=ics]").dataset.id;if(cid)t.id=cid;
  if(!t.title||!t.date){alert("Укажи название и дату дела");return}
  saveFile((t.title.replace(/[^\p{L}\p{N} ]+/gu,"").trim().slice(0,40)||"delo")+".ics",makeIcs(t),"text/calendar")}
})();
</script>
<style>
.gear{border:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:17px;display:inline-grid;place-items:center;color:var(--ink)}

  border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.dp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.dp-note{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin:6px 0 10px}

</style>
<script>
(function(){
const MODS=[["budget","Бюджет",[["overview","Обзор"],["plan","План"],["tx","Операции"],["recurring","Регулярные"],["categories","Категории"]]],
  ["todo","Дела",[["today","Сегодня"],["all","Все дела"]]],
  ["study","Учёба",[["study","Обзор"],["courses","Предметы"]]],
  ["shop","Покупки",[["shop","Списки"]]],["recipes","Рецепты",[["recipes","Рецепты"]]],["home","Дом",[["home","Замеры"]]]];
const SOON=[];
const TABS=MODS.flatMap(m=>m[2]);
function modOf(tab){return MODS.find(m=>m[2].some(t=>t[0]===tab))}
const S={courses:[],studyMeta:null,courseOpen:null,homeItems:[],homeQ:"",homeRoom:"",stores:[],recipes:[],recipeOpen:null,recipeQ:"",recipeTag:"",balance:{checks:[]},lastTab:{budget:"overview",todo:"today",shop:"shop",recipes:"recipes",home:"home",study:"study"},tab:"overview",month:curMonth(),planVisited:false,txFilter:"",sheet:null,status:"loading",
  config:null,recurring:null,months:{},loaded:{config:false,rec:false,months:false,tasks:false,bal:false,shop:false,rec:false,home:false,study:false,smeta:false}};
let db=null, toastTimer=null;

/* ---------- utils ---------- */
function pad(n){return String(n).padStart(2,"0")}
function curMonth(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addMonth(m,k){let [y,mo]=m.split("-").map(Number);mo+=k;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return y+"-"+pad(mo)}
function monthDiff(a,b){const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y2-y1)*12+(m2-m1)}
function daysIn(m){const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()}
function monthName(m,cased){const [y,mo]=m.split("-").map(Number);const n=new Date(y,mo-1,1).toLocaleString("ru-RU",{month:"long"});const s=n.charAt(0).toUpperCase()+n.slice(1);return cased?s:s+" "+y}
const GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const PREP=["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
const ACC=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
function mIdx(m){return Number(m.split("-")[1])-1}
const fmt=new Intl.NumberFormat("ru-RU",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const fmt0=new Intl.NumberFormat("ru-RU",{style:"currency",currency:"EUR",maximumFractionDigits:0});
function eur(c){return fmt.format((c||0)/100)}
function eur0(c){return fmt0.format(Math.round((c||0)/100))}
function plain(c){return c?((c/100).toFixed(2)).replace(".",","):""}
function parseMoney(s){if(s==null)return null;s=String(s).replace(/\s|€/g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isFinite(v)?Math.round(v*100):NaN}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o||{}))}
function toast(msg){clearTimeout(toastTimer);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;toastTimer=setTimeout(()=>t.remove(),2200)}

/* ---------- model ---------- */
function groups(){return (S.config&&S.config.groups)||[]}
function allCats(){const out=[];for(const g of groups())for(const c of g.cats)out.push({...c,group:g.name,gid:g.id,income:!!g.income});return out}
function catById(id){return allCats().find(c=>c.id===id)}
function catName(id){const c=catById(id);return c?c.name:"Без категории"}
function catLabel(id){const c=catById(id);return c?(c.name+" · "+c.group):"Без категории"}
function isSave(id){const c=catById(id);return !!(c&&c.env==="save")}
function envCats(){return allCats().filter(c=>c.env&&!c.archived)}
function saveBalance(id,m){const c=catById(id);let b=(c&&c.start)||0;
  for(const [k,mo] of Object.entries(S.months)){if(k>m)continue;
    if(mo.planned&&mo.envelopes&&mo.envelopes[id])b+=mo.envelopes[id];
    for(const t of mo.tx||[])if(t.cat===id)b+=t.amount}
  return b}
function recs(){return (S.recurring&&S.recurring.items)||[]}
function incomeCat(){return S.config&&S.config.incomeCat}
function monthDoc(m){return S.months[m]||null}
function blankMonth(){return {income:(S.config&&S.config.defaultIncome)||0,planned:false,envelopes:{},items:[],recOff:{},recAmt:{},tx:[]}}
function recApplies(r,m){return r.active!==false&&(!r.from||r.from<=m)&&(!r.until||m<=r.until)}
function recForMonth(m){
  const mo=monthDoc(m)||blankMonth();
  return recs().filter(r=>recApplies(r,m)).map(r=>{
    const off=!!(mo.recOff&&mo.recOff[r.id]);
    const amt=(mo.recAmt&&mo.recAmt[r.id]!=null)?mo.recAmt[r.id]:r.amount;
    const tx=(mo.tx||[]).find(t=>t.rec===r.id);
    return {...r,off,amt,paid:!!tx,tx};
  }).sort((a,b)=>a.day-b.day||a.name.localeCompare(b.name));
}
function calc(m){
  const mo=monthDoc(m)||blankMonth();
  const planBy={},factBy={};
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v};
  const rl=recForMonth(m);
  let recSum=0,itemSum=0,envSum=0,saveSum=0;
  if(mo.planned){
    for(const r of rl)if(!r.off){add(planBy,r.cat,r.amt);recSum+=r.amt}
    for(const it of mo.items||[]){add(planBy,it.cat,it.amount);itemSum+=it.amount}
    for(const [k,v] of Object.entries(mo.envelopes||{})){if(!v)continue;if(isSave(k))saveSum+=v;else{add(planBy,k,v);envSum+=v}}
  }
  let spent=0,incomeFact=0,fromSavings=0;const ic=incomeCat();
  for(const t of mo.tx||[]){
    const c=catById(t.cat);
    if(t.amount>0&&(t.cat===ic||(c&&c.income))){incomeFact+=t.amount;continue}
    if(isSave(t.cat)){fromSavings+=-t.amount;continue}
    add(factBy,t.cat,-t.amount);spent+=-t.amount;
  }
  const planned=recSum+itemSum+envSum+saveSum;
  return {mo,rl,planBy,factBy,recSum,itemSum,envSum,saveSum,fromSavings,planned,spent,incomeFact,income:mo.income||0,free:(mo.income||0)-planned};
}

/* ---------- balance & economy ---------- */
function lastCheck(){const c=(S.balance&&S.balance.checks)||[];return c.length?c[c.length-1]:null}
function netSince(at){let n=0;for(const mo of Object.values(S.months))for(const t of mo.tx||[])if(t.created&&t.created>at)n+=t.amount;return n}
function estBalance(){const l=lastCheck();return l?l.amount+netSince(l.at):null}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nextPayday(){
  const now=new Date(),day=(S.config&&S.config.incomeDay)||10,cm=curMonth();
  const mk=m=>m+"-"+pad(Math.min(day,daysIn(m)));
  if(now.getDate()<day)return mk(cm);
  return mk(addMonth(cm,1));
}
function daysBetween(a,b){const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)}
function economy(){
  const bal=estBalance();if(bal==null)return null;
  const td=today(),pay=nextPayday(),days=daysBetween(td,pay);
  const obl=[];
  for(const M of [curMonth(),addMonth(curMonth(),1)])for(const r of recForMonth(M)){if(r.off||r.paid)continue;
    const due=M+"-"+pad(Math.min(r.day,daysIn(M)));if(due<pay&&(M===curMonth()||due>=td))obl.push({...r,due})}
  const mo=monthDoc(curMonth())||blankMonth();
  const items=(mo.items||[]).filter(it=>!(mo.tx||[]).some(t=>t.item===it.id));
  const oblSum=obl.reduce((s,r)=>s+r.amt,0),itemSum=items.reduce((s,i)=>s+i.amount,0);
  const free=bal-oblSum-itemSum;
  return {bal,pay,days,obl,oblSum,items,itemSum,free,perDay:days>0?Math.floor(free/days):free};
}
function ago(at){const m=Math.round((Date.now()-at)/6e4);if(m<2)return "только что";if(m<60)return m+" мин назад";const h=Math.round(m/60);if(h<24)return h+" ч назад";const d=Math.round(h/24);return d+" дн. назад"}
function vEconomy(){

    <div><div class="big num${e.perDay<0?" neg":""}">${e.days>0?eur(e.perDay):"Зарплата сегодня"}${e.days>0?` <small>в день</small>`:""}</div>
      <div class="hint" style="margin-top:4px">до зарплаты ${e.days} дн. · ${pd} ${GEN[pm-1]}</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px"><button class="btn sm" type="button" data-act="recon">Сверить остаток</button>
      ${S.confirmUndo?`<span class="hint">Отменить сверку ${ago(l.at)} (${eur(l.amount)})${l.txId?" и её трату":""}?</span><button class="btn danger sm" type="button" data-act="undocheck2">Отменить</button>`:`<button class="link" type="button" data-act="undocheck">Отменить последнюю сверку</button>`}</div></div>
    <div class="brk num"><span class="t">На счёте сейчас</span><span class="v">${eur(e.bal)}</span>
      <span class="t">Обязательные платежи до зарплаты (${e.obl.length})</span><span class="v">−${eur(e.oblSum)}</span>
      ${e.items.length?`<span class="t">Запланированные покупки (${e.items.length})</span><span class="v">−${eur(e.itemSum)}</span>`:""}
      <span class="t tot">Можно потратить</span><span class="v tot">${eur(e.free)}</span></div>
  </div></section>`;

/* ---------- storage ---------- */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p}
function writeErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument")toast("Нет прав на изменение этих данных");
  else if(code==="quota_exceeded")toast("Хранилище заполнено, изменения не сохранены");
  else toast("Не сохранилось. Проверь связь и повтори");
}
function saveMonth(m,mut){
  if(!db)return Promise.resolve();
  const next=clone(monthDoc(m)||blankMonth());mut(next);
  S.months[m]=next;render();
  return enqueue("m"+m,()=>db.collection("months").doc(m).set(next)).catch(writeErr);
}
function saveConfig(mut){
  if(!db)return Promise.resolve();
  const next=clone(S.config);mut(next);S.config=next;render();
  return enqueue("config",()=>db.doc("budget/config").set(next)).catch(writeErr);
}
function saveRecurring(mut){
  if(!db)return Promise.resolve();
  const next=clone(S.recurring||{items:[]});if(!next.items)next.items=[];mut(next);S.recurring=next;render();
  return enqueue("rec",()=>db.doc("budget/recurring").set(next)).catch(writeErr);
}

  main.innerHTML=({overview:vOverview,plan:vPlan,tx:vTx,recurring:vRecurring,categories:vCategories,today:vToday,all:vAll,shop:vShop,recipes:vRecipes,home:vHome,study:vStudy,courses:vCourses}[S.tab])();

function ledger(c){

function chime(){if(S.mute)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const sr=actx.sampleRate,dur=.34,n=Math.floor(sr*dur),buf=actx.createBuffer(1,n,sr),d=buf.getChannelData(0);
  // pencil: grainy noise, slightly uneven pressure, stroke left-to-right
  let grain=0;for(let i=0;i<n;i++){const t=i/sr;if(i%Math.floor(sr/900)===0)grain=.55+Math.random()*.45;
    const env=Math.min(1,t/.025)*Math.min(1,(dur-t)/.06)*(.75+.25*Math.sin(t*38));d[i]=(Math.random()*2-1)*grain*env}
  const src=actx.createBufferSource();src.buffer=buf;
  const bp=actx.createBiquadFilter();bp.type="bandpass";bp.Q.value=.9;const t0=actx.currentTime;bp.frequency.setValueAtTime(1500,t0);bp.frequency.linearRampToValueAtTime(2100,t0+dur);
  const hp=actx.createBiquadFilter();hp.type="lowpass";hp.frequency.value=2800;
  const g=actx.createGain();g.gain.value=.14;
  src.connect(bp).connect(hp).connect(g).connect(actx.destination);src.start(t0);src.stop(t0+dur+.02)}catch(e){}}

const CAL="Google Calendar";let mcp=null;

function evBody(t){const allDay=!t.time;const b={summary:(t.done?"✓ ":"")+t.title,description:(t.note?t.note+"\n\n":"")+"Из Домашнего планера",useDefaultReminders:false,overrideReminders:t.done?[]:[{method:"popup",minutes:allDay?360:15}]};
  const [y,m,d]=t.date.split("-").map(Number);
  if(allDay){b.allDay=true;b.startTime=t.date+"T00:00:00";b.endTime=dstr(new Date(y,m-1,d+1))+"T00:00:00"}
  else{const [hh,mm]=t.time.split(":").map(Number);const st=new Date(y,m-1,d,hh,mm);b.startTime=fmtLocal(st);b.endTime=fmtLocal(new Date(st.getTime()+30*6e4))}
  return b}
function evId(r){const p=r&&(r.payload!==undefined?r.payload:r);if(!p)return null;
  if(typeof p==="object"){if(typeof p.id==="string")return p.id;if(typeof p.eventId==="string")return p.eventId;if(p.event&&typeof p.event.id==="string")return p.event.id}
  const m=/"id"\s*:\s*"([^"]+)"/.exec(typeof p==="string"?p:JSON.stringify(p));return m?m[1]:null}

const calBusy={};
async function syncTask(t,action,patch){
  if(!mcp)return;patch=patch||(f=>patch(f));
  const run=async()=>{
    const cal=t.cal;
    try{
      if(action==="delete"){if(cal&&cal.id)await mcp.callTool(CAL,"delete_event",{eventId:cal.id,notificationLevel:"NONE"});return}
      const want=!!t.date;const allDay=!t.time;
      if(!want){if(cal&&cal.id){await mcp.callTool(CAL,"delete_event",{eventId:cal.id,notificationLevel:"NONE"}).catch(()=>{});patch({cal:null,calErr:null})}return}
      if(t.done&&!(cal&&cal.id))return;
      const body=evBody(t);
      if(cal&&cal.id&&cal.allDay===allDay){
        try{await mcp.callTool(CAL,"update_event",{eventId:cal.id,notificationLevel:"NONE",...body});if(t.calErr)patch({calErr:null});return}
        catch(e){if(e&&e.code!=="tool_error")throw e}
      } else if(cal&&cal.id){await mcp.callTool(CAL,"delete_event",{eventId:cal.id,notificationLevel:"NONE"}).catch(()=>{})}
      const r=await mcp.callTool(CAL,"create_event",{...body,notificationLevel:"NONE"});
      const id=evId(r);patch({cal:id?{id,allDay}:{id:"",allDay},calErr:id?null:"noid"});
    }catch(e){if(action!=="delete")patch({calErr:(e&&e.code)||"upstream_error"})}
  };
  calBusy[t.id]=(calBusy[t.id]||Promise.resolve()).then(run,run);return calBusy[t.id];
}

/* ---------- study: programme (syllabus) ---------- */
const SYS=[["○","не начато"],["◐","изучаю"],["●","уверенно"],["⚠","слабо"]];
const SYB={now:["★ сейчас","acc"],all:["∞ всегда","good"],later:["⏸ позже","mute"],wait:["⌛ ждём","warn"]};
const SYB_ORDER=["now","all","later","wait"];
const SYMARK=[" ","~","x","!"];
function syCount(list){let n=0,d=0,w=0;for(const t of list){n++;if(t.s===2)d++;if(t.s===3)w++}return {n,d,w}}
function syTopics(b){return (b.secs||[]).flatMap(s=>s.topics||[])}
function syAll(c){return ((c.syllabus&&c.syllabus.blocks)||[]).flatMap(syTopics)}
function syIsOpen(id,dflt){return S.syOpen&&id in S.syOpen?S.syOpen[id]:dflt}
function syToText(c){const out=[];for(const b of (c.syllabus&&c.syllabus.blocks)||[]){out.push("# "+b.title+" | "+(SYB[b.status]||SYB.later)[0].replace(/^\S+\s/,""));
  if(b.note)for(const l of b.note.split("\n"))out.push("> "+l);
  for(const s of b.secs||[]){out.push("## "+s.title);for(const t of s.topics||[])out.push("- ["+SYMARK[t.s||0]+"] "+t.t)}out.push("")}
  return out.join("\n").trim()}
function syParse(text,old){const prev={};for(const t of old||[])prev[t.t.toLowerCase()]=t.s||0;
  const st={"сейчас":"now","всегда":"all","позже":"later","ждём":"wait","ждем":"wait"};const blocks=[];let b=null,s=null;
  for(let raw of text.split("\n")){const l=raw.trim();if(!l)continue;let m;
    if(m=l.match(/^#\s+(?!#)(.*)$/)){const [ti,stt]=m[1].split("|").map(x=>x.trim());b={id:uid("b"),title:ti||"Блок",status:st[(stt||"").toLowerCase()]||"later",note:"",secs:[]};blocks.push(b);s=null;continue}
    if(!b){b={id:uid("b"),title:"Темы",status:"now",note:"",secs:[]};blocks.push(b)}
    if(m=l.match(/^##+\s*(.*)$/)){s={id:uid("s"),title:m[1]||"Раздел",topics:[]};b.secs.push(s);continue}
    if(m=l.match(/^>\s?(.*)$/)){b.note=(b.note?b.note+"\n":"")+m[1];continue}
    m=l.match(/^(?:[-*•]\s*)?(?:\[([ xX~!])\]\s*)?(.*)$/);const tt=m[2].trim();if(!tt)continue;
    if(!s&&!/^[-*•]/.test(l)){b.note=(b.note?b.note+"\n":"")+l;continue}
    if(!s){s={id:uid("s"),title:"Темы",topics:[]};b.secs.push(s)}
    const mk=m[1]?{" ":0,"~":1,"x":2,"X":2,"!":3}[m[1]]:undefined;
    s.topics.push({id:uid("t"),t:tt,s:mk!==undefined&&m[1]!==" "?mk:(prev[tt.toLowerCase()]||0)})}
  return {blocks}}
function mutTopic(cid,tid,fn){mutCourse(cid,c=>{for(const b of c.syllabus.blocks)for(const s of b.secs)for(const t of s.topics)if(t.id===tid)fn(t)})}
function vSyllabus(c){const sy=c.syllabus;
  if(!sy||!(sy.blocks||[]).length)return `<section class="panel"><h2>Программа</h2><div class="empty">Список тем для повторения. Вставь план текстом: «# Блок | сейчас», «## Раздел», «- тема».</div><button class="btn sm" type="button" data-act="syedit" data-c="${c.id}" style="margin-top:8px">Вставить программу</button></section>`;
  const all=syAll(c),k=syCount(all),weak=S.syWeak&&k.w;
  let h=`<section class="panel"><h2>Программа<span class="side num">уверенно ${k.d} из ${k.n}${k.w?` · ⚠ ${k.w}`:""}</span></h2>
    <div class="semb" style="margin-top:0"><i style="width:${k.n?Math.round(k.d/k.n*100):0}%;background:var(--good)"></i></div>
    <div class="sylegend hint">${SYS.map(x=>x.join(" ")).join(" · ")} — нажми на кружок</div>
    <div class="tags" style="margin:8px 0 2px">${k.w?`<button class="chip ${weak?"bad":"mute"}" type="button" data-act="syweak" style="border:0;padding:6px 11px">⚠ только слабые</button>`:""}<button class="chip mute" type="button" data-act="syedit" data-c="${c.id}" style="border:0;padding:6px 11px">✎ Изменить списком</button></div>`;
  for(const b of sy.blocks){const bk=syCount(syTopics(b));const ob=weak?true:syIsOpen(b.id,b.status==="now");const bs=SYB[b.status]||SYB.later;
    if(weak&&!syTopics(b).some(t=>t.s===3))continue;
    h+=`<div class="syb${b.status==="later"||b.status==="wait"?" dim":""}"><button class="syhead" type="button" data-act="sytog" data-id="${b.id}"><span class="car">${ob?"▾":"▸"}</span><span class="syt">${esc(b.title)}</span><span class="num sycnt">${bk.d}/${bk.n}</span></button><button class="chip ${bs[1]}" type="button" data-act="syblk" data-c="${c.id}" data-id="${b.id}" style="border:0;padding:4px 9px">${bs[0]}</button></div>`;
    if(!ob)continue;
    if(b.note&&!weak)h+=`<div class="hint synote">${esc(b.note)}</div>`;
    for(const s of b.secs||[]){const tp=(s.topics||[]).filter(t=>!weak||t.s===3);if(!tp.length)continue;const sk=syCount(s.topics||[]);const os=weak?true:syIsOpen(s.id,false);
      h+=`<button class="sysec" type="button" data-act="sytog" data-id="${s.id}"><span class="car">${os?"▾":"▸"}</span><span class="syt">${esc(s.title)}</span><span class="num sycnt">${sk.d}/${sk.n}</span><span class="symeter"><i style="width:${sk.n?Math.round(sk.d/sk.n*100):0}%"></i></span></button>`;
      if(os)h+=`<div class="sylist">${tp.map(t=>`<div class="sytop s${t.s||0}"><button class="sydot" type="button" data-act="sycyc" data-c="${c.id}" data-id="${t.id}" aria-label="${esc(t.t)}: ${SYS[t.s||0][1]}">${SYS[t.s||0][0]}</button><span>${esc(t.t)}</span></div>`).join("")}</div>`}}
  return h+`</section>`}

/* ---------- home ---------- */
const ROOMS=["Спальня","Гостиная","Кухня","Ванная","Прихожая","Разное"];
const DIMABBR={"ширина":"Ш","глубина":"Г","высота":"В","длина":"Д","диаметр":"⌀"};
function isNum(v){return /^\d+(?:[.,]\d+)?$/.test(String(v).trim())}
function dimVal(v,u){v=String(v||"").trim();return isNum(v)&&u?v+" "+u:v}
function homeSummary(h){const ds=(h.dims||[]).filter(d=>DIMABBR[(d.k||"").toLowerCase().trim()]&&isNum(d.v));
  if(ds.length<2||ds.length!==(h.dims||[]).length)return "";
  return {v:ds.map(d=>d.v).join(" × ")+(h.unit?" "+h.unit:""),cap:ds.map(d=>d.k.toLowerCase().trim()).join(" × ")}}
function homeText(h){return h.title+"\n"+(h.dims||[]).map(d=>d.k+": "+dimVal(d.v,h.unit)).join("\n")+(h.note?"\n"+h.note:"")}
function rooms(){const r=[...ROOMS];for(const h of S.homeItems)if(h.room&&!r.includes(h.room))r.push(h.room);return r}
function openHome(id){const h=id?S.homeItems.find(x=>x.id===id):null;
  openSheet({type:"home",key:"home-"+(id||Date.now()),isNew:!h,data:h?clone(h):{id:uid("h"),title:"",room:S.homeRoom||"Разное",unit:"см",dims:[{k:"Ширина",v:""},{k:"Глубина",v:""},{k:"Высота",v:""}],note:""}})}
function saveHome(h){if(!db)return;const d=clone(h);delete d.id;const i=S.homeItems.findIndex(x=>x.id===h.id);
  if(i>=0)S.homeItems[i]={...h};else S.homeItems.push({...h});render();
  return enqueue("h"+h.id,()=>db.collection("home").doc(h.id).set(d)).catch(writeErr)}
function readHomeForm(s){const g=i=>document.getElementById(i);if(!g("h-title"))return;const d=s.data;
  d.title=g("h-title").value;d.room=g("h-room").value.trim();d.unit=g("h-unit").value;d.note=g("h-note").value;
  d.dims=d.dims.map((x,n)=>({k:(g("hk-"+n)||{}).value||"",v:(g("hv-"+n)||{}).value||""}))}
function vHome(){
  const q=S.homeQ.toLowerCase();
  const list=S.homeItems.filter(h=>(!S.homeRoom||h.room===S.homeRoom)&&(!q||(h.title+" "+(h.note||"")+" "+(h.dims||[]).map(d=>d.k+" "+d.v).join(" ")).toLowerCase().includes(q)));
  const used=rooms().filter(r=>S.homeItems.some(h=>h.room===r));
  let h=`<div class="stack"><div class="toolbar"><input type="text" id="hq" placeholder="Найти: матрас, рулы, 56…" value="${esc(S.homeQ)}" data-act="hq" style="max-width:320px" autocomplete="off">
    ${used.length>1?`<div class="tags"><button class="chip ${!S.homeRoom?"acc":"mute"}" type="button" data-act="hroom" data-r="" style="border:0;padding:5px 10px">все</button>${used.map(r=>`<button class="chip ${S.homeRoom===r?"acc":"mute"}" type="button" data-act="hroom" data-r="${esc(r)}" style="border:0;padding:5px 10px">${esc(r)}</button>`).join("")}</div>`:""}</div>`;
  if(!S.homeItems.length)return h+`<section class="panel"><div class="empty">Здесь хранятся замеры и хозяйские мелочи: размеры белья, шкафов, окон, цоколи лампочек, модели фильтров. Нажми «+ Запись».</div></section></div>`;
  if(!list.length)return h+`<div class="empty">Ничего не нашлось.</div></div>`;
  for(const r of rooms()){const l=list.filter(x=>(x.room||"Разное")===r).sort((a,b)=>a.title.localeCompare(b.title));if(!l.length)continue;
    h+=`<div class="room-h">${esc(r)}</div><div class="hgrid">${l.map(x=>{const sm=homeSummary(x);
      return `<article class="hcard"><div class="t"><span>${esc(x.title)}</span></div>
      ${sm?`<div><div class="hsum num">${esc(sm.v)}</div><div class="hint">${esc(sm.cap)}</div></div>`:`<div class="dims num">${(x.dims||[]).map(d=>`<span class="k">${esc(d.k)}</span><span class="v">${esc(dimVal(d.v,x.unit))}</span>`).join("")}</div>`}
      ${x.note?`<div class="hint">${esc(x.note)}</div>`:""}
      <div class="acts"><button class="link" type="button" data-act="hcopy" data-id="${x.id}">Копировать</button><button class="link" type="button" data-act="hedit" data-id="${x.id}">Изменить</button></div></article>`}).join("")}</div>`}
  return h+`</div>`}

    body=`<h3>Сверка остатка</h3><p class="hint" style="margin:-6px 0 14px">Бери сумму «доступно» в банке: в ней уже учтены зарезервированные платежи.</p>

    <form class="form" data-form="syl"><label class="f wide">Темы<textarea id="sy-text" style="min-height:50vh;font-size:13px" data-autofocus>${esc(syToText(c))}</textarea></label>

  else if(s.type==="sem"){const m=S.studyMeta||{};

  }
  else if(s.type==="store"){const d=s.data;
    body=`<h3>${s.isNew?"Новый магазин":"Магазин"}</h3><form class="form" data-form="store">

      <div class="r"><button class="btn ghost" type="button" data-act="close">Отмена</button><button class="btn" type="submit">Сохранить</button></div></div></form>`;
  }
  else if(s.type==="item"){const d=s.data;
    body=`<h3>${esc(d.name)}</h3><form class="form" data-form="item2">
      <label class="f wide">Что купить<input type="text" id="it-name" value="${esc(d.name)}" required data-autofocus></label>
      <label class="f">Сколько<input type="text" id="it-qty" value="${esc(d.qty)}"></label>
      <label class="f">Магазин<select id="it-store">${S.stores.map(x=>`<option value="${x.id}"${x.id===s.store?" selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label class="f wide">Заметка<input type="text" id="it-note" value="${esc(d.note)}" placeholder="Марка, размер"></label>
      <div class="actions wide"><button class="btn ghost" type="button" data-act="delitem">Удалить</button>
      <div class="r"><button class="btn ghost" type="button" data-act="close">Отмена</button><button class="btn" type="submit">Сохранить</button></div></div></form>`;

  else if(s.type==="recipe"){const d=s.data;
    body=`<h3>${s.isNew?"Новый рецепт":"Рецепт"}</h3><form class="form" data-form="recipe">

      <label class="f wide">Ингредиенты: по одному в строке, количество через тире<textarea id="rc-ings" placeholder="Гречка — 200 г&#10;Лук — 1 шт&#10;Соль">${esc(ingsText(d.ingredients))}</textarea></label>
      <label class="f wide">Шаги: каждый с новой строки<textarea id="rc-steps">${esc(d.steps)}</textarea></label>
      <label class="f wide">Заметка<input type="text" id="rc-note" value="${esc(d.note)}" placeholder="Откуда рецепт, что поменять"></label>
      <div class="actions wide">${s.isNew?"":(s.confirmDel?`<button class="btn danger" type="button" data-act="delrecipe2">Удалить навсегда</button>`:`<button class="btn ghost" type="button" data-act="delrecipe">Удалить</button>`)}
      <div class="r"><button class="btn ghost" type="button" data-act="close">Отмена</button><button class="btn" type="submit">Сохранить</button></div></div></form>`;
  }
  else if(s.type==="env"){

    const defG=save?(groups().find(g=>/saving|накоп/i.test(g.name))||groups().find(g=>!g.income)):(groups().find(g=>/food/i.test(g.name))||groups().find(g=>!g.income));
    const gsel=`<select id="e-g">${groups().filter(g=>!g.income).map(g=>`<option value="${g.id}"${(d.gid||defG&&defG.id)===g.id?" selected":""}>${esc(g.name)}</option>`).join("")}</select>`;
    body=`<h3>${s.isNew?"Новый конверт":esc(d.name)}</h3>
    <div class="seg" style="margin-bottom:8px"><button type="button" class="${!save?"on":""}" data-act="envkind" data-k="spend">На траты</button><button type="button" class="${save?"on":""}" data-act="envkind" data-k="save">Накопительный</button></div>
    <p class="hint" style="margin:0 0 14px">${save?"Каждый месяц откладываешь сумму, остаток переходит дальше. Траты из этого конверта не уменьшают бюджет месяца.":"Лимит на месяц. Каждая трата в этой категории уменьшает остаток, в новом месяце лимит начинается заново."}</p>
    <form class="form" data-form="env">
      <label class="f wide">Название<input type="text" id="e-name" value="${esc(d.name)}" placeholder="${save?"Например, На котов":"Например, Бензин"}" required data-autofocus></label>
      <label class="f">${save?"Откладывать в месяц, €":"Лимит в месяц, €"}<input class="money" id="e-m" inputmode="decimal" value="${plain(d.monthly)}"></label>
      <label class="f">Группа${gsel}</label>
      ${save?`<label class="f">Цель, €<input class="money" id="e-goal" inputmode="decimal" value="${plain(d.goal)}" placeholder="необязательно"></label>
      <label class="f">Уже накоплено, €<input class="money" id="e-start" inputmode="decimal" value="${plain(d.start)}" placeholder="0"></label>`:""}
      <div class="actions wide">${s.isNew?"":`<button class="btn ghost" type="button" data-act="envdrop">Убрать из конвертов</button>`}
      <div class="r"><button class="btn ghost" type="button" data-act="close">Отмена</button><button class="btn" type="submit">Сохранить</button></div></div>
    </form>`;
  }
  L.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function newTx(kind){
  const m=S.month,isCur=m===curMonth();
  const date=isCur?today():m+"-"+(kind==="income"?pad(Math.min(S.config.incomeDay||1,daysIn(m))):"01");
  const firstExp=catById(S.config.reconCat)||allCats().find(c=>!c.income&&!c.archived&&/^food$/i.test(c.name))||allCats().find(c=>!c.income&&!c.archived);
  const t={id:uid("t"),date,amount:kind==="income"?(S.config.defaultIncome||0):0,cat:kind==="income"?incomeCat():(firstExp&&firstExp.id),note:""};
  openSheet({type:"tx",key:"tx-new-"+t.id,isNew:true,kind,data:t});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const md=e.target.closest("[data-mod]");if(md){go(S.lastTab[md.dataset.mod]);return}
  const tb=e.target.closest("[data-tab]");
  if(tb){go(tb.dataset.tab);return}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="scrim"&&e.target!==el)return;
  if(["income","env","recamt","txfilter","gname","cname","rq","hq"].includes(a))return;
  const m=S.month;
  switch(a){
    case "prev":S.month=addMonth(m,-1);S.txFilter="";render();break;
    case "next":S.month=addMonth(m,1);S.txFilter="";render();break;
    case "goplan":go("plan",true);break;
    case "startplan":{const ec=envCats();
      saveMonth(m,mo=>{mo.planned=true;if(!mo.income)mo.income=S.config.defaultIncome||0;mo.envelopes={};for(const x of ec)if(x.monthly)mo.envelopes[x.id]=x.monthly});toast("План создан");break}
    case "newenv":openSheet({type:"env",key:"env-new",isNew:true,data:{name:"",env:el.dataset.kind||"spend",monthly:0,goal:0,start:0,gid:""}});break;
    case "editenv":{const x=catById(id);if(x)openSheet({type:"env",key:"env-"+id,isNew:false,data:{id:x.id,name:x.name,env:x.env||"spend",monthly:x.monthly||0,goal:x.goal||0,start:x.start||0,gid:x.gid}});break}
    case "envkind":{const s=S.sheet;if(!s)break;readEnvForm(s);s.data.env=el.dataset.k;s.dirtyRender=true;renderSheet();break}
    case "envdrop":{const s=S.sheet;if(!s)break;const eid=s.data.id;closeSheet();
      saveConfig(cf=>{for(const g of cf.groups)for(const c of g.cats)if(c.id===eid){delete c.env;delete c.monthly;delete c.goal;delete c.start}});
      if(monthDoc(m)&&monthDoc(m).envelopes&&monthDoc(m).envelopes[eid])saveMonth(m,mo=>{delete mo.envelopes[eid]});toast("Конверт убран, категория осталась");break}
    case "resetplan":S.confirmReset=m;render();break;
    case "resetplan2":S.confirmReset=null;saveMonth(m,mo=>{mo.planned=false;mo.envelopes={};mo.items=[];mo.recOff={};mo.recAmt={}});break;
    case "paytoggle":{const r=recForMonth(m).find(x=>x.id===id);if(!r)break;
      if(r.paid)saveMonth(m,mo=>{mo.tx=mo.tx.filter(t=>t.rec!==id)});
      else if(r.approx){openSheet({type:"tx",key:"tx-pay-"+r.id,isNew:true,kind:"expense",month:m,data:{id:uid("t"),date:m===curMonth()?today():m+"-"+pad(Math.min(r.day,daysIn(m))),amount:-r.amt,cat:r.cat,note:r.name,rec:r.id}})}
      else{saveMonth(m,mo=>{mo.tx=mo.tx||[];mo.tx.push({id:uid("t"),date:m+"-"+pad(Math.min(r.day,daysIn(m))),amount:-r.amt,cat:r.cat,note:r.name,rec:r.id,created:Date.now()})});toast(r.name+": оплачено")}
      break}
    case "itemtoggle":{const mo=monthDoc(m);const it=(mo.items||[]).find(x=>x.id===id);if(!it)break;
      const has=(mo.tx||[]).some(t=>t.item===id);
      saveMonth(m,mo=>{if(has)mo.tx=mo.tx.filter(t=>t.item!==id);else mo.tx.push({id:uid("t"),date:m===curMonth()?today():m+"-01",amount:-it.amount,cat:it.cat,note:it.name,item:it.id,created:Date.now()})});break}
    case "itemdel":saveMonth(m,mo=>{mo.items=(mo.items||[]).filter(x=>x.id!==id)});break;
    case "recoff":{const on=el.checked;saveMonth(m,mo=>{mo.recOff=mo.recOff||{};if(on)delete mo.recOff[id];else mo.recOff[id]=true});break}
    case "edittx":{const t=(monthDoc(m).tx||[]).find(x=>x.id===id);if(!t)break;const c=catById(t.cat);
      openSheet({type:"tx",key:"tx-"+id,isNew:false,kind:t.amount>0&&(c&&c.income||t.cat===incomeCat())?"income":"expense",data:clone(t),month:m});break}
    case "addinc":newTx("income");break;
    case "kind":{const s=S.sheet;if(!s)break;readTxForm(s);s.kind=el.dataset.k;
      const fc=allCats().find(c=>(s.kind==="income")===c.income&&!c.archived);
      const cur=catById(s.data.cat);if(!cur||cur.income!==(s.kind==="income"))s.data.cat=s.kind==="income"?incomeCat():(fc&&fc.id);
      s.dirtyRender=true;renderSheet();break}
    case "close":closeSheet();break;
    case "scrim":closeSheet();break;
    case "deltx":S.sheet.confirmDel=true;readTxForm(S.sheet);S.sheet.dirtyRender=true;renderSheet();break;
    case "deltx2":{const s=S.sheet,mm=s.month;closeSheet();saveMonth(mm,mo=>{mo.tx=mo.tx.filter(t=>t.id!==s.data.id)});toast("Удалено");break}
    case "editrec":{const r=recs().find(x=>x.id===id);if(r)openSheet({type:"rec",key:"rec-"+id,isNew:false,data:clone(r)});break}
    case "newrec":{const fc=allCats().find(c=>!c.income&&!c.archived);openSheet({type:"rec",key:"rec-new",isNew:true,data:{id:uid("r"),name:"",amount:0,day:10,cat:fc&&fc.id,kind:el.dataset.kind,approx:false,active:true,from:curMonth(),until:"",note:""}});break}
    case "delrec":S.sheet.confirmDel=true;S.sheet.dirtyRender=true;renderSheet();break;
    case "delrec2":{const rid=S.sheet.data.id;closeSheet();saveRecurring(x=>{x.items=x.items.filter(r=>r.id!==rid)});toast("Платёж удалён");break}
    case "recon":openSheet({type:"recon",key:"recon"+Date.now(),mode:"spend"});break;
    case "rcmode":{const s=S.sheet;if(!s)break;readRecon(s);s.mode=el.dataset.k;s.dirtyRender=true;renderSheet();break}
    case "undocheck":S.confirmUndo=true;render();break;
    case "undocheck2":{S.confirmUndo=false;const l=lastCheck();if(!l)break;
      if(l.txId&&l.month&&monthDoc(l.month))saveMonth(l.month,mo=>{mo.tx=(mo.tx||[]).filter(t=>t.id!==l.txId)});
      const next=clone(S.balance);next.checks=next.checks.slice(0,-1);S.balance=next;render();
      enqueue("bal",()=>db.doc("budget/balance").set(next)).catch(writeErr);toast(l.txId?"Сверка и её трата отменены":"Сверка отменена");break}
    case "tcheck":toggleTask(id,el);break;
    case "copen":S.courseOpen=id;if(S.tab!=="courses")go("courses");else{render()}window.scrollTo(0,0);break;
    case "cback":S.courseOpen=null;render();break;
    case "ctab":S.courseTab=el.dataset.k;render();break;
    case "sytog":{S.syOpen=S.syOpen||{};const c=S.courses.find(x=>x.id===S.courseOpen);let dflt=false;
      if(c&&c.syllabus){const b=c.syllabus.blocks.find(x=>x.id===id);if(b)dflt=b.status==="now"}
      S.syOpen[id]=!syIsOpen(id,dflt);render();break}

    case "syblk":mutCourse(el.dataset.c,c=>{const b=c.syllabus.blocks.find(x=>x.id===id);if(b)b.status=SYB_ORDER[(SYB_ORDER.indexOf(b.status)+1)%SYB_ORDER.length]});break;
    case "syedit":{const c=S.courses.find(x=>x.id===el.dataset.c);if(c)openSheet({type:"syl",key:"syl-"+c.id,cid:c.id});break}
    case "syfill":{const c=S.courses.find(x=>x.id===S.sheet.cid);const ta=document.getElementById("p-topics");if(!c||!ta)break;
      const lines=[];for(const b of (c.syllabus&&c.syllabus.blocks)||[])if(b.status==="now")for(const sc of b.secs||[]){const left=(sc.topics||[]).filter(t=>t.s!==2);if(left.length)lines.push(sc.title.replace(/^[\d.]+\s*/,"")+(left.some(t=>t.s===3)?" ⚠":""))}

      S.courses=S.courses.filter(x=>x.id!==cid);S.courseOpen=null;render();enqueue("c"+cid,()=>db.collection("study").doc(cid).delete()).catch(writeErr);toast("Предмет удалён");break}

function splitHtml(s){
  if(!s.split)return `<div class="wide"><button class="link" type="button" data-act="splitadd">Разделить чек на категории</button></div>`;
  return `<div class="wide" style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;font-weight:700;color:var(--muted)">Часть чека в другие категории</span>
    ${s.split.map((r,n)=>`<div class="drow">${catSelect("sp-cat-"+n,r.cat,false,'aria-label="Категория части '+(n+1)+'"')}<input class="money" id="sp-amt-${n}" inputmode="decimal" placeholder="Сумма" value="${esc(r.amt||"")}" aria-label="Сумма части ${n+1}"><button class="x" type="button" data-act="splitdel" data-n="${n}" aria-label="Убрать часть">×</button></div>`).join("")}
    <div><button class="link" type="button" data-act="splitadd">+ ещё категория</button></div>
    <div class="preview num" id="sp-rest">${splitRest(s)}</div></div>`}
function splitRest(s){const total=Math.abs(parseMoney(s.totalRaw!=null?s.totalRaw:plain(Math.abs(s.data.amount||0)))||0);
  const parts=(s.split||[]).reduce((a,r)=>a+Math.abs(parseMoney(r.amt)||0),0);const rest=total-parts;
  return rest<0?`<b style="color:var(--bad)">Части больше суммы чека на ${eur(-rest)}</b>`:`В основную категорию останется <b>${eur(rest)}</b> из ${eur(total)}`}
function readTxForm(s){const g=i=>document.getElementById(i);if(!g("s-amt"))return;
  if(s.split)s.split=s.split.map((r,n)=>({cat:(g("sp-cat-"+n)||{}).value||r.cat,amt:(g("sp-amt-"+n)||{}).value||""}));s.totalRaw=g("s-amt").value;
  const v=parseMoney(g("s-amt").value);s.data.amount=(s.kind==="income"?1:-1)*Math.abs(v||0);s.data.date=g("s-date").value;s.data.cat=g("s-cat").value;s.data.note=g("s-note").value}

  else if(a==="env"){const v=parseMoney(el.value);if(isNaN(v))return;saveMonth(m,mo=>{mo.envelopes=mo.envelopes||{};if(!v)delete mo.envelopes[id];else mo.envelopes[id]=v})}

function reconPreview(s){const l=lastCheck();if(!l)return "";
  const bal=parseMoney(s.bal),mv=parseMoney(s.moved)||0;
  if(bal==null||isNaN(bal))return `Прошлая сверка ${ago(l.at)}: ${eur(l.amount)}. После неё записано ${eur(netSince(l.at))}.`;
  const exp=l.amount+netSince(l.at)-(s.mode==="fix"?0:mv),diff=exp-bal;
  if(s.mode==="fix")return `Ожидалось ${eur(exp)}. Новая точка отсчёта: ${eur(bal)}. В траты ничего не запишется.`;
  return Math.abs(diff)<1?`Всё сходится: незаписанных трат нет.`:diff>0?`Должно было остаться ${eur(exp)}, на счёте ${eur(bal)}.<br><b>Незаписанные траты: ${eur(diff)}</b>. Запишу их одной тратой.`:`На счёте на <b>${eur(-diff)}</b> больше, чем ожидалось: возврат или незаписанный доход. Запишу как корректировку.`}

function go(tab,keepMonth){
  if(tab==="plan"&&!S.planVisited&&!keepMonth&&S.month===curMonth()){S.month=addMonth(curMonth(),1)}
  if(tab==="plan")S.planVisited=true;
  S.tab=tab;S.lastTab[modOf(tab)[0]]=tab;try{history.replaceState(null,"","#"+tab)}catch(e){location.hash=tab}render();
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==S.tab){S.tab=h;render()}});

/* ---------- boot ---------- */
(function(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h})();
render();
function ready(){const L=S.loaded;if(L.config&&L.rec&&L.months&&L.tasks&&L.bal&&L.shop&&L.recipes&&L.home&&L.study&&L.smeta){S.status="ready";clearTimeout(slowT);render()}}
const slowT=setTimeout(()=>{if(S.status==="loading"){S.status="slow";render()}},10000);
(async()=>{
  try{db=await (window.claude&&window.claude.use?window.claude.use("db"):null)}catch(e){db=null}
  (window.claude&&window.claude.use?window.claude.use("mcp"):Promise.resolve(null)).then(m=>{mcp=m;if(S.status==="ready")render()},()=>{});
  if(!db){clearTimeout(slowT);S.status="nodb";render();return}
  const fail=e=>{if(e&&e.code==="revoked"){S.status="nodb"}else S.status="error";render()};
  db.doc("budget/config").onSnapshot(s=>{S.config=s.exists?s.data():null;if(!s.metadata.fromCache)S.loaded.config=true;if(S.status==="ready")render();ready()},fail);
  db.doc("budget/recurring").onSnapshot(s=>{S.recurring=s.exists?s.data():{items:[]};if(!s.metadata.fromCache)S.loaded.rec=true;if(S.status==="ready")render();ready()},fail);
  db.doc("budget/balance").onSnapshot(s=>{S.balance=s.exists?s.data():{checks:[]};if(!S.balance.checks)S.balance.checks=[];if(!s.metadata.fromCache)S.loaded.bal=true;if(S.status==="ready")render();ready()},fail);
  db.collection("shop").onSnapshot(q=>{S.stores=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0));if(!q.metadata.fromCache)S.loaded.shop=true;if(S.status==="ready")render();ready()},fail);
  db.collection("study").onSnapshot(q=>{S.courses=q.docs.map(d=>({...d.data(),id:d.id}));if(!q.metadata.fromCache)S.loaded.study=true;if(S.status==="ready")render();ready()},fail);
  db.doc("meta/study").onSnapshot(x=>{S.studyMeta=x.exists?x.data():null;if(!x.metadata.fromCache)S.loaded.smeta=true;if(S.status==="ready")render();ready()},fail);
  db.collection("home").onSnapshot(q=>{S.homeItems=q.docs.map(d=>({...d.data(),id:d.id}));if(!q.metadata.fromCache)S.loaded.home=true;if(S.status==="ready")render();ready()},fail);
  db.collection("recipes").onSnapshot(q=>{S.recipes=q.docs.map(d=>({...d.data(),id:d.id}));if(!q.metadata.fromCache)S.loaded.recipes=true;if(S.status==="ready")render();ready()},fail);
  db.collection("tasks").onSnapshot(q=>{S.tasks=q.docs.map(d=>({...d.data(),id:d.id}));if(!q.metadata.fromCache)S.loaded.tasks=true;if(S.status==="ready")render();ready()},fail);
  db.collection("months").onSnapshot(q=>{const o={};for(const d of q.docs)o[d.id]=d.data();S.months=o;if(!q.metadata.fromCache)S.loaded.months=true;if(S.status==="ready")render();ready()},fail);
})();
})();
</script>
